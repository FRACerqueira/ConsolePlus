name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detects whether the push/PR touches any .cs file. Changes that don't
  # (docs, yml, csproj, etc.) still get a build (below) but skip the test run.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # No checkout here: dorny/paths-filter resolves changed files via the
      # GitHub API instead of a local git diff, avoiding the cost of a
      # full-history clone (kept consistent with PromptPlus's ci.yml).
      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            code:
              - '**/*.cs'

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build library (Release)
        run: dotnet build src/ConsolePlus.csproj --configuration Release

      # Skipped when the change doesn't touch any .cs file — those only need a
      # build to verify nothing broke, not a full test pass.
      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: >
          dotnet test tests/ConsolePlus.Tests/ConsolePlus.Tests.csproj
          --configuration Debug
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.code == 'true'
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/**/*.trx"
          retention-days: 7

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.code == 'true'
        with:
          name: coverage-${{ matrix.os }}
          path: "**/TestResults/**/coverage.cobertura.xml"
          retention-days: 7

